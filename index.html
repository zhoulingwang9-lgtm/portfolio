<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Studio — Fearless Vision Delivered</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  body { font-family: 'Inter', sans-serif; }
  #root { min-height: 100vh; }

  /* Animation keyframes */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(32px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { transform: translateY(110%); }
    to { transform: translateY(0); }
  }
  .anim-fade-down {
    opacity: 0;
    animation: fadeDown 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .anim-fade-up {
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .anim-slide-up {
    animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .overlay-menu {
    transition: opacity 0.3s ease;
  }

  /* Scroll reveal with frosted glass */
  .reveal-block, .reveal-card {
    opacity: 0;
    transform: translateY(40px);
    filter: blur(12px);
    backdrop-filter: blur(0px);
    transition: opacity 1.1s cubic-bezier(0.22,1,0.36,1), transform 1.1s cubic-bezier(0.22,1,0.36,1), filter 1.1s cubic-bezier(0.22,1,0.36,1);
  }
  .reveal-block.visible, .reveal-card.visible {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0px);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const stats = [
  { num: '300', label: 'CRAFTED\nBRANDS' },
  { num: '200', label: 'DIGITAL\nPRODUCTS' },
  { num: '100', label: 'VENTURES\nFUNDED' }
];

const headingWords = ['Fearless', 'Vision', 'Delivered'];

function ArrowUpRight({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="7" y1="17" x2="17" y2="7"></line>
      <polyline points="7 7 17 7 17 17"></polyline>
    </svg>
  );
}

function XIcon({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>

}

function Logo() {

    <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ border: `2px solid ${ACCENT}` }}>
      <div className="w-2.5 h-2.5 rounded-full" style={{ background: ACCENT }}></div>
    </div>
  );
}

  const [menuOpen, setMenuOpen] = useState(false);

      </div>

      {/* PROJECTS SECTION */}
      <section className="relative z-10 bg-white px-5 sm:px-8 md:px-12 py-20 md:py-28">
        <div className="flex items-end justify-between mb-12 md:mb-16">
          <div>
            <p className="text-xs font-semibold tracking-widest uppercase" style={{ color: ACCENT }}>SELECTED WORK</p>
            <h2 className="font-semibold uppercase mt-3" style={{ fontSize: 'clamp(2rem, 5vw, 4rem)', lineHeight: 1 }}>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
          {projects.map((p, i) => (
            <a key={p.title} href={p.href}
              className="group block border-2 border-black overflow-hidden transition-transform hover:-translate-y-1 reveal-card"
              style={{ transitionDelay: `${i * 0.1}s` }}>
              <div className="relative h-64 md:h-80 overflow-hidden">
                <img src={p.cover} alt={p.title}
                  className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                <div className="absolute inset-0" style={{ background: `linear-gradient(to top, ${p.color}e6 0%, ${p.color}33 60%, transparent 100%)` }}></div>

                <div className="absolute top-4 right-5 w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center group-hover:bg-white/40 transition-colors" style={{ color: '#fff' }}>
                  <ArrowUpRight size={18} />

              </div>
              <div className="p-6 md:p-8" style={{ background: p.color, color: '#fff' }}>
                <p className="text-xs font-semibold tracking-widest uppercase opacity-60 mb-2">{p.subtitle}</p>
                <h3 className="font-semibold uppercase" style={{ fontSize: 'clamp(1.2rem, 2vw, 1.6rem)', lineHeight: 1.2 }}>

            </a>
          ))}
        </div>
      </section>

      {/* ABOUT / SELF INTRO */}
      <section className="relative z-10 bg-white px-5 sm:px-8 md:px-12 py-20 md:py-32 border-t border-black/10">
        <div className="reveal-block">
          <p className="text-xs font-semibold tracking-widest uppercase" style={{ color: ACCENT }}>ABOUT ME</p>
          <h2 className="font-semibold mt-4 leading-tight" style={{ fontSize: 'clamp(1.8rem, 4vw, 3.5rem)' }}>
            我是一名大四视觉设计学生，<br />
            用设计把抽象的想法变成<span style={{ color: ACCENT }}>看得见的体验</span>。
          </h2>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-16 mt-10 md:mt-16">
          <div className="reveal-block">
            <p className="text-base md:text-lg leading-relaxed" style={{ color: '#333' }}>
              专注于品牌视觉、AIGC创意与交互设计。从概念到落地，我相信好的设计不只是好看，而是能讲清楚一个故事、解决一个问题。
            </p>
            <p className="text-base md:text-lg leading-relaxed mt-5" style={{ color: '#333' }}>

            </p>
          </div>
          <div className="reveal-block">
            <div className="space-y-4">
              <div className="flex items-center justify-between border-b border-black/10 pb-3">
                <span className="text-sm font-semibold tracking-widest uppercase" style={{ color: '#666' }}>Brand Identity</span>
                <span className="text-sm font-semibold">品牌视觉</span>
              </div>
              <div className="flex items-center justify-between border-b border-black/10 pb-3">

                <span className="text-sm font-semibold tracking-widest uppercase" style={{ color: '#666' }}>Web Design</span>
                <span className="text-sm font-semibold">网页设计</span>
              </div>
            </div>
            <a href="#" className="inline-flex items-center gap-2 mt-8 font-semibold" style={{ color: ACCENT }}>

      {/* FOOTER */}

        <p className="text-xs font-semibold tracking-widest uppercase" style={{ color: '#999' }}>
          © 2026 Zhou Lingwang · All Rights Reserved

        <p className="text-xs font-semibold tracking-widest uppercase" style={{ color: '#999' }}>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Scroll reveal
setTimeout(() => {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal-block, .reveal-card').forEach(el => observer.observe(el));
}, 500);
</script>
</body>
</html>
