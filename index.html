<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Studio — Fearless Vision Delivered</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
<script src="https://unpkg.com/lucide-react@0.294.0/dist/umd/lucide-react.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  body { font-family: 'Inter', sans-serif; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { motion, AnimatePresence } = window.Motion;
const { ArrowUpRight, X } = window.LucideReact;

const ACCENT = '#5E0ED7';

const fadeDown = {
  hidden: { opacity: 0, y: -20 },
  show: (i) => ({
    opacity: 1, y: 0,
    transition: { delay: i * 0.1, duration: 0.5, ease: [0.22, 1, 0.36, 1] }
  })
};

const fadeUp = {
  hidden: { opacity: 0, y: 32 },
  show: (i) => ({
    opacity: 1, y: 0,
    transition: { delay: i * 0.12, duration: 0.6, ease: [0.22, 1, 0.36, 1] }
  })
};

const stats = [
  { num: '300', label: 'CRAFTED\nBRANDS' },
  { num: '200', label: 'DIGITAL\nPRODUCTS' },
  { num: '100', label: 'VENTURES\nFUNDED' }
];

const headingWords = ['Fearless', 'Vision', 'Delivered'];

function Logo() {
  return (
    <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ border: `2px solid ${ACCENT}` }}>
      <div className="w-2.5 h-2.5 rounded-full" style={{ background: ACCENT }}></div>
    </div>
  );
}

function App() {
  const [menuOpen, setMenuOpen] = useState(false);

  return (
    <div className="relative min-h-screen flex flex-col overflow-hidden bg-white" style={{ fontFamily: "'Inter', sans-serif", color: '#000' }}>
      {/* Background Video */}
      <video
        autoPlay loop muted playsInline
        className="absolute inset-0 w-full h-full object-cover"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260517_222138_3e3205be-3364-417b-a64a-bfe087acbec4.mp4"
      />
      {/* Overlay to ensure text readability */}
      <div className="absolute inset-0 bg-white/10"></div>

      {/* NAV */}
      <nav className="relative z-10 flex items-center justify-between px-5 sm:px-8 md:px-12 pt-5 md:pt-6">
        <motion.div custom={0} variants={fadeDown} initial="hidden" animate="show">
          <Logo />
        </motion.div>
        <div className="hidden md:flex items-center gap-8">
          {['Story', 'Expertise', 'Studios', 'Feedback'].map((link, i) => (
            <motion.a key={link} href="#" custom={i + 1} variants={fadeDown} initial="hidden" animate="show"
              className="text-sm font-semibold tracking-widest uppercase text-black">
              {link}
            </motion.a>
          ))}
        </div>
        <motion.button custom={5} variants={fadeDown} initial="hidden" animate="show"
          onClick={() => setMenuOpen(true)}
          className="w-9 h-9 rounded-full bg-black flex flex-col items-center justify-center gap-1">
          <span className="w-4 h-0.5 bg-white"></span>
          <span className="w-4 h-0.5 bg-white"></span>
          <span className="w-4 h-0.5 bg-white"></span>
        </motion.button>
      </nav>

      {/* STATS ROW */}
      <div className="relative z-10 flex-1 flex items-center justify-end px-5 sm:px-8 md:px-12 py-8 md:py-0">
        <div className="flex items-start gap-5 sm:gap-8 md:gap-10">
          {stats.map((stat, i) => (
            <motion.div key={stat.num} custom={i + 2} variants={fadeUp} initial="hidden" animate="show"
              className="text-right">
              <div className="font-semibold leading-none" style={{ fontSize: 'clamp(1.5rem, 5vw, 3.5rem)' }}>
                <span style={{ color: ACCENT, fontSize: '0.5em', marginRight: '2px' }}>+</span>
                <span className="text-black">{stat.num}</span>
              </div>
              <div className="font-semibold tracking-widest uppercase whitespace-pre-line leading-tight mt-2"
                style={{ fontSize: '10px', lineHeight: '1.2' }}>
                {stat.label}
              </div>
            </motion.div>
          ))}
        </div>
      </div>

      {/* BOTTOM SECTION */}
      <div className="relative z-10 px-5 sm:px-8 md:px-12 pb-8 md:pb-12 flex flex-col gap-6 md:gap-12">
        {/* Row A */}
        <div className="flex items-center justify-between gap-4">
          <motion.p custom={5} variants={fadeUp} initial="hidden" animate="show"
            className="font-semibold tracking-widest uppercase"
            style={{ fontSize: '10px', maxWidth: '130px', lineHeight: 1.6 }}>
            Shaping Bold<br />Visions Into Power<br />For Your Tribe
          </motion.p>
          <motion.a href="#" custom={6} variants={fadeUp} initial="hidden" animate="show"
            className="flex items-center gap-1 font-semibold whitespace-nowrap"
            style={{ color: ACCENT, fontSize: '16px' }}>
            Work With Us
            <ArrowUpRight size={18} />
          </motion.a>
        </div>

        {/* Row B */}
        <div className="flex items-end justify-between gap-3 sm:gap-4">
          <motion.div custom={7} variants={fadeUp} initial="hidden" animate="show"
            className="shrink-0" style={{ width: '120px' }}>
            <p className="font-semibold tracking-widest uppercase text-left md:text-right"
              style={{ fontSize: '9px', lineHeight: 1.6 }}>
              Creative Studios Built Around Elevating Your Vision Into Striking Reality
            </p>
          </motion.div>
          <div className="text-right">
            {headingWords.map((word, i) => (
              <div key={word} className="overflow-hidden">
                <motion.div
                  initial={{ y: '110%' }}
                  animate={{ y: 0 }}
                  transition={{ delay: 0.4 + i * 0.14, duration: 0.7, ease: [0.22, 1, 0.36, 1] }}
                  className="font-semibold uppercase text-black"
                  style={{ fontSize: 'clamp(2rem, 9vw, 9rem)', lineHeight: 0.88 }}>
                  {word}
                </motion.div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* MOBILE MENU OVERLAY */}
      <AnimatePresence>
        {menuOpen && (
          <motion.div
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            className="fixed inset-0 z-50 bg-white flex flex-col px-5 sm:px-8 md:px-12 pt-5 md:pt-6">
            <div className="flex items-center justify-between">
              <Logo />
              <button onClick={() => setMenuOpen(false)}
                className="w-9 h-9 rounded-full bg-black flex items-center justify-center">
                <X size={18} color="white" />
              </button>
            </div>
            <div className="flex flex-col gap-8 mt-16">
              {['Story', 'Expertise', 'Studios', 'Feedback'].map(link => (
                <a key={link} href="#" className="text-3xl font-semibold tracking-widest uppercase text-black">
                  {link}
                </a>
              ))}
            </div>
            <div className="mt-auto pb-12">
              <a href="#" className="flex items-center gap-1 text-xl font-semibold" style={{ color: ACCENT }}>
                Work With Us
                <ArrowUpRight size={22} />
              </a>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
