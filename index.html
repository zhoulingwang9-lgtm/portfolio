// Scroll reveal
setTimeout(() => {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal-block, .reveal-card').forEach(el => observer.observe(el));
}, 500);

// Projects sticky stack scaling
setTimeout(() => {
  const stack = document.querySelector('.pf-stack');
  const wraps = document.querySelectorAll('.pf-sticky');
  const cards = [...wraps].map(w => w.querySelector('.pf-card'));
  const total = cards.length;
  function size() {
    if (!stack || !total) return;
    let tallest = 0;
    cards.forEach(c => { if (c.offsetHeight > tallest) tallest = c.offsetHeight; });
    const band = Math.max(window.innerHeight * 0.85, tallest + 200);
    stack.style.height = Math.round(band * total) + 'px';
  }
  function update() {
    if (!stack || !total) return;
    const sr = stack.getBoundingClientRect();
    const band = (sr.height / total) || 1;
    for (let i = 0; i < total; i++) {
      const p = Math.max(0, Math.min(1, (-sr.top - i * band) / band));
      const target = 1 - (total - 1 - i) * 0.03;
      const s = 1 - p * (1 - target);
      cards[i].style.transform = 'scale(' + s.toFixed(4) + ')';
    }
  }
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => { update(); ticking = false; });
  }, { passive: true });
  window.addEventListener('resize', () => { size(); update(); });
  window.addEventListener('load', () => { size(); update(); });
  setTimeout(() => { size(); update(); }, 800);
}, 1000);
