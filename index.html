<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Studio — Fearless Vision Delivered</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  body { font-family: 'Inter', sans-serif; }
  #root { min-height: 100vh; }

  /* Animation keyframes */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(32px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { transform: translateY(110%); }
    to { transform: translateY(0); }
  }
  .anim-fade-down {
    opacity: 0;
    animation: fadeDown 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .anim-fade-up {
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .anim-slide-up {
    animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .overlay-menu {
    transition: opacity 0.3s ease;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const ACCENT = '#5E0ED7';

const stats = [
  { num: '300', label: 'CRAFTED\nBRANDS' },
  { num: '200', label: 'DIGITAL\nPRODUCTS' },
  { num: '100', label: 'VENTURES\nFUNDED' }
];

const headingWords = ['Fearless', 'Vision', 'Delivered'];

function ArrowUpRight({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="7" y1="17" x2="17" y2="7"></line>
      <polyline points="7 7 17 7 17 17"></polyline>
    </svg>
  );
}

function XIcon({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  );
}

function Logo() {
  return (
    <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ border: `2px solid ${ACCENT}` }}>
      <div className="w-2.5 h-2.5 rounded-full" style={{ background: ACCENT }}></div>
    </div>
  );
}

function App() {
  const [menuOpen, setMenuOpen] = useState(false);

  const projects = [
    {
      title: '抖音生活服务 × 酸甜苦辣',
      subtitle: '城市味觉计划',
      desc: '短视频 / 海报 / 互动测试 / 团购体验',
      href: 'project-douyin.html',
      color: '#161823'
    },
    {
      title: '48H 森林度假计划',
      subtitle: '治愈系品牌视觉',
      desc: '主视觉 / 社交媒体 / 运营物料',
      href: 'project-forest.html',
      color: '#2D4A3E'
    },
    {
      title: '梦境便利店',
      subtitle: 'AIGC 视觉设计项目',
      desc: '梦境商品 / AIGC实验 / 海报系统',
      href: 'project-dream.html',
      color: '#5E0ED7'
    },
    {
      title: 'Design Process',
      subtitle: '设计流程',
      desc: '从概念到落地的完整设计方法论',
      href: 'design-process.html',
      color: '#222222'
    }
  ];

  return (
    <div className="relative bg-white" style={{ fontFamily: "'Inter', sans-serif", color: '#000' }}>
      {/* HERO SECTION */}
      <div className="relative min-h-screen flex flex-col overflow-hidden">
      {/* Background Video */}
      <video
        autoPlay loop muted playsInline
        className="absolute inset-0 w-full h-full object-cover"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260517_222138_3e3205be-3364-417b-a64a-bfe087acbec4.mp4"
      />
      <div className="absolute inset-0 bg-white/10"></div>

      {/* NAV */}
      <nav className="relative z-10 flex items-center justify-between px-5 sm:px-8 md:px-12 pt-5 md:pt-6">
        <div className="anim-fade-down" style={{ animationDelay: '0s' }}>
          <Logo />
        </div>
        <div className="hidden md:flex items-center gap-8">
          {['Story', 'Expertise', 'Studios', 'Feedback'].map((link, i) => (
            <a key={link} href="#" className="anim-fade-down text-sm font-semibold tracking-widest uppercase text-black"
              style={{ animationDelay: `${(i + 1) * 0.1}s` }}>
              {link}
            </a>
          ))}
        </div>
        <button onClick={() => setMenuOpen(true)}
          className="anim-fade-down w-9 h-9 rounded-full bg-black flex flex-col items-center justify-center gap-1"
          style={{ animationDelay: '0.5s' }}>
          <span className="w-4 h-0.5 bg-white"></span>
          <span className="w-4 h-0.5 bg-white"></span>
          <span className="w-4 h-0.5 bg-white"></span>
        </button>
      </nav>

      {/* STATS ROW */}
      <div className="relative z-10 flex-1 flex items-center justify-end px-5 sm:px-8 md:px-12 py-8 md:py-0">
        <div className="flex items-start gap-5 sm:gap-8 md:gap-10">
          {stats.map((stat, i) => (
            <div key={stat.num} className="anim-fade-up text-right"
              style={{ animationDelay: `${(i + 2) * 0.12}s` }}>
              <div className="font-semibold leading-none" style={{ fontSize: 'clamp(1.5rem, 5vw, 3.5rem)' }}>
                <span style={{ color: ACCENT, fontSize: '0.5em', marginRight: '2px' }}>+</span>
                <span className="text-black">{stat.num}</span>
              </div>
              <div className="font-semibold tracking-widest uppercase whitespace-pre-line leading-tight mt-2"
                style={{ fontSize: '10px', lineHeight: 1.2 }}>
                {stat.label}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* BOTTOM SECTION */}
      <div className="relative z-10 px-5 sm:px-8 md:px-12 pb-8 md:pb-12 flex flex-col gap-6 md:gap-12">
        {/* Row A */}
        <div className="flex items-center justify-between gap-4">
          <p className="anim-fade-up font-semibold tracking-widest uppercase"
            style={{ fontSize: '10px', maxWidth: '130px', lineHeight: 1.6, animationDelay: '0.6s' }}>
            Shaping Bold<br />Visions Into Power<br />For Your Tribe
          </p>
          <a href="#" className="anim-fade-up flex items-center gap-1 font-semibold whitespace-nowrap"
            style={{ color: ACCENT, fontSize: '16px', animationDelay: '0.72s' }}>
            Work With Us
            <ArrowUpRight size={18} />
          </a>
        </div>

        {/* Row B */}
        <div className="flex items-end justify-between gap-3 sm:gap-4">
          <div className="anim-fade-up shrink-0" style={{ width: '120px', animationDelay: '0.84s' }}>
            <p className="font-semibold tracking-widest uppercase text-left md:text-right"
              style={{ fontSize: '9px', lineHeight: 1.6 }}>
              Creative Studios Built Around Elevating Your Vision Into Striking Reality
            </p>
          </div>
          <div className="text-right">
            {headingWords.map((word, i) => (
              <div key={word} className="overflow-hidden">
                <div className="anim-slide-up font-semibold uppercase text-black"
                  style={{
                    fontSize: 'clamp(2rem, 9vw, 9rem)',
                    lineHeight: 0.88,
                    animationDelay: `${0.4 + i * 0.14}s`,
                    transform: 'translateY(110%)'
                  }}>
                  {word}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
      </div>

      {/* PROJECTS SECTION */}
      <section className="relative z-10 bg-white px-5 sm:px-8 md:px-12 py-20 md:py-28">
        <div className="flex items-end justify-between mb-12 md:mb-16">
          <div>
            <p className="text-xs font-semibold tracking-widest uppercase" style={{ color: ACCENT }}>SELECTED WORK</p>
            <h2 className="font-semibold uppercase mt-3" style={{ fontSize: 'clamp(2rem, 5vw, 4rem)', lineHeight: 1 }}>
              Projects
            </h2>
          </div>
          <p className="hidden md:block text-xs font-semibold tracking-widest uppercase" style={{ color: '#666' }}>04 CASE STUDIES</p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
          {projects.map((p, i) => (
            <a key={p.title} href={p.href}
              className="group block border-2 border-black overflow-hidden transition-transform hover:-translate-y-1"
              style={{ background: p.color }}>
              <div className="p-8 md:p-12 flex flex-col justify-between" style={{ minHeight: '320px', color: '#fff' }}>
                <div className="flex items-start justify-between">
                  <span className="text-xs font-semibold tracking-widest uppercase opacity-60">
                    0{i + 1} / PROJECT
                  </span>
                  <span className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center group-hover:bg-white/40 transition-colors">
                    <ArrowUpRight size={18} />
                  </span>
                </div>
                <div>
                  <p className="text-xs font-semibold tracking-widest uppercase opacity-60 mb-2">{p.subtitle}</p>
                  <h3 className="font-semibold uppercase" style={{ fontSize: 'clamp(1.4rem, 2.5vw, 2.2rem)', lineHeight: 1.1 }}>
                    {p.title}
                  </h3>
                  <p className="text-sm mt-3 opacity-80">{p.desc}</p>
                </div>
              </div>
            </a>
          ))}
        </div>
      </section>

      {/* MOBILE MENU OVERLAY */}
      {menuOpen && (
        <div className="overlay-menu fixed inset-0 z-50 bg-white flex flex-col px-5 sm:px-8 md:px-12 pt-5 md:pt-6">
          <div className="flex items-center justify-between">
            <Logo />
            <button onClick={() => setMenuOpen(false)}
              className="w-9 h-9 rounded-full bg-black flex items-center justify-center">
              <span style={{ color: 'white' }}><XIcon size={18} /></span>
            </button>
          </div>
          <div className="flex flex-col gap-8 mt-16">
            {['Story', 'Expertise', 'Studios', 'Feedback'].map(link => (
              <a key={link} href="#" className="text-3xl font-semibold tracking-widest uppercase text-black">
                {link}
              </a>
            ))}
          </div>
          <div className="mt-auto pb-12">
            <a href="#" className="flex items-center gap-1 text-xl font-semibold" style={{ color: ACCENT }}>
              Work With Us
              <ArrowUpRight size={22} />
            </a>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
